spring.application.name=backend

# Porta do backend (o app acessa http://IP-DO-COMPUTADOR:8080)
server.port=8080

# Banco MySQL rodando no próprio computador (porta padrão 3306).
# createDatabaseIfNotExist=true: o banco "catalogo_filmes" é criado sozinho na primeira vez.
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_filmes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
# Usuário e senha do MySQL instalado na máquina (troque pela senha de vocês)
spring.datasource.username=root
spring.datasource.password=root

# Cria e atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Não deixa a conexão com o banco aberta até o fim da resposta (tira um aviso do log)
spring.jpa.open-in-view=false

# Chave secreta usada para assinar os tokens JWT (mínimo de 32 caracteres).
# Num sistema de verdade ela ficaria numa variável de ambiente, fora do código.
jwt.segredo=troque-esta-chave-secreta-do-catalogo-de-filmes-2026
